apiVersion: v1
kind: Secret
metadata:
  name: crisisiq-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://crisisiq:crisisiq@postgres:5432/crisisiq
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: replace-with-production-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: crisisiq
            - name: POSTGRES_USER
              value: crisisiq
            - name: POSTGRES_PASSWORD
              value: crisisiq
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
